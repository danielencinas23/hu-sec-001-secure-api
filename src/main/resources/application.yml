spring:
  application:
    name: secure-api

server:
  # Puerto seguro (HTTPS). El puerto HTTP sin cifrar se define en app.server.http-port
  port: ${HTTPS_PORT:8443}
  ssl:
    enabled: true
    key-store: ${SSL_KEYSTORE:classpath:keystore/secure-api.p12}
    key-store-type: PKCS12
    key-store-password: ${SSL_KEYSTORE_PASSWORD:changeit}
    key-alias: secure-api
    # Solo se aceptan TLS 1.2 y TLS 1.3 (SSLv3, TLS 1.0 y TLS 1.1 quedan rechazados)
    enabled-protocols: TLSv1.2,TLSv1.3
    protocol: TLS
    ciphers:
      # TLS 1.3
      - TLS_AES_256_GCM_SHA384
      - TLS_AES_128_GCM_SHA256
      - TLS_CHACHA20_POLY1305_SHA256
      # TLS 1.2 (solo AEAD con secreto perfecto hacia adelante)
      - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
      - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
      - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256
  error:
    include-message: always
    include-stacktrace: never

app:
  server:
    # Conector HTTP plano: GET/HEAD se redirigen a HTTPS (301) y el resto se rechaza (400).
    # Usa -1 para no abrir ningún puerto HTTP.
    http-port: ${HTTP_PORT:8080}
